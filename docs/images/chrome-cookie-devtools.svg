<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative Chrome DevTools cookie view for ASP.NET_SessionId</title>
  <desc id="desc">A simplified Chrome DevTools Application tab showing Cookies, the my.polaris.ro entry, and the ASP.NET_SessionId row selected so users know where to copy the cookie value.</desc>
  <rect width="1200" height="760" fill="#1e1e1e"/>
  <rect x="0" y="0" width="1200" height="52" fill="#202124"/>
  <text x="28" y="33" fill="#e8eaed" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="21">Chrome DevTools</text>
  <text x="220" y="33" fill="#8ab4f8" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="20">Application</text>
  <rect x="0" y="52" width="320" height="708" fill="#202124"/>
  <rect x="320" y="52" width="880" height="708" fill="#1e1e1e"/>

  <text x="18" y="95" fill="#e8eaed" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="600">Application</text>
  <text x="18" y="145" fill="#bdc1c6" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17">Manifest</text>
  <text x="18" y="182" fill="#bdc1c6" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17">Service workers</text>
  <text x="18" y="220" fill="#bdc1c6" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17">Storage</text>
  <text x="18" y="268" fill="#e8eaed" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="17" font-weight="600">Cookies</text>
  <rect x="12" y="286" width="280" height="38" rx="8" fill="#35363a"/>
  <text x="28" y="311" fill="#e8eaed" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="16">https://my.polaris.ro</text>

  <rect x="350" y="68" width="810" height="34" rx="8" fill="#2b2d30"/>
  <text x="372" y="91" fill="#9aa0a6" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="16">Filter</text>

  <rect x="350" y="124" width="810" height="50" fill="#202124" stroke="#3c4043"/>
  <line x1="700" y1="124" x2="700" y2="174" stroke="#3c4043"/>
  <text x="370" y="156" fill="#e8eaed" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="600">Name</text>
  <text x="720" y="156" fill="#e8eaed" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="600">Value</text>

  <rect x="350" y="174" width="810" height="54" fill="#174ea6"/>
  <line x1="700" y1="174" x2="700" y2="228" stroke="#8ab4f8"/>
  <text x="370" y="208" fill="#ffffff" font-family="Consolas, Menlo, monospace" font-size="21">ASP.NET_SessionId</text>
  <text x="720" y="208" fill="#ffffff" font-family="Consolas, Menlo, monospace" font-size="21">example_session_cookie_value</text>

  <rect x="350" y="228" width="810" height="354" fill="#1e1e1e" stroke="#3c4043"/>
  <rect x="540" y="352" width="420" height="34" rx="6" fill="#2b2d30" stroke="#5f6368"/>
  <text x="564" y="375" fill="#e8eaed" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="16">Select the ASP.NET_SessionId row, then copy the Value column</text>

  <rect x="350" y="602" width="810" height="130" fill="#1b1c1f" stroke="#3c4043"/>
  <text x="370" y="638" fill="#e8eaed" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="600">Cookie Value</text>
  <text x="370" y="686" fill="#e8eaed" font-family="Consolas, Menlo, monospace" font-size="26">example_session_cookie_value</text>

  <text x="24" y="720" fill="#9aa0a6" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="15">Illustrative example for README guidance. Use the actual ASP.NET_SessionId shown in your own browser session.</text>
</svg>